# KernelLens - Linux Kernel Analysis Suite
# Workspace Root Configuration
# Following Rust Cargo Workspace Best Practices (2026)

[workspace]
members = [
    "crates/kernel_core",
    "crates/kernel_cli",
    "crates/kernel_ffi",
    "crates/xtask",
    "crates/test_utils",
]
resolver = "2"

# ============================================================
# Shared Package Metadata (Workspace Inheritance)
# Child crates use: version.workspace = true
# ============================================================
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KernelLens Contributors"]
license = "MIT"
repository = "https://github.com/user/kernel-lenz"
description = "Windows-native Linux kernel analysis and visualization suite"
keywords = ["kernel", "linux", "android", "reverse-engineering", "elf"]
categories = ["command-line-utilities", "development-tools"]

# ============================================================
# Centralized Dependency Management
# All child crates MUST reference these versions
# Usage in child: nom = { workspace = true }
# ============================================================
[workspace.dependencies]
# --- Core Binary Parsing ---
nom = "7.1"                   # Combinator-based binary parser
byteorder = "1.5"             # Endianness handling
memmap2 = "0.9"               # Memory-mapped file I/O for large images

# --- Compression ---
lz4_flex = "0.11"             # Pure Rust LZ4 (no C dependency!)
flate2 = "1.0"                # Gzip/Deflate
zstd = { version = "0.13", features = ["zstdmt"] }  # Zstandard compression

# --- ELF / Binary Format ---
object = { version = "0.36", features = ["read", "write", "elf"] }

# --- Error Handling ---
thiserror = "2.0"             # Library-style errors (for kernel_core)
anyhow = "1.0"                # Application-style errors (for kernel_cli)

# --- Serialization (for FFI and config) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# --- CLI ---
clap = { version = "4.5", features = ["derive", "env", "unicode"] }
indicatif = "0.17"            # Progress bars
console = "0.15"              # Terminal colors and styling
dialoguer = "0.11"            # Interactive prompts

# --- Logging & Tracing ---
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Flutter Bridge (FFI) ---
# Version will be updated when flutter_rust_bridge is configured
# flutter_rust_bridge = "2.0"

# --- Async (for potential future features) ---
tokio = { version = "1.41", features = ["rt", "fs", "io-util"] }

# --- Development & Testing ---
pretty_assertions = "1.4"
tempfile = "3.14"

# --- XTask Automation ---
xshell = "0.2"                # Shell command execution in xtask
which = "7.0"                 # Find executables

# ============================================================
# Workspace-wide Lints (Clippy Configuration)
# ============================================================
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
